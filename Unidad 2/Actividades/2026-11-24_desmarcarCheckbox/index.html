<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relacion 4 - Preferencias mediante checkboxes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <form>
        <fieldset id="caja">
            <legend>Selecciona tus lenguajes favoritos:</legend>
            <label><input type="checkbox" name="lenguajes" value="JavaScript">JavaScript</label>
            <label><input type="checkbox" name="lenguajes" value="Python">Python</label>
            <label><input type="checkbox" name="lenguajes" value="Java">Java</label>
            <label><input type="checkbox" name="lenguajes" value="C#">C#</label>
            <label><input type="checkbox" name="lenguajes" value="PHP">PHP</label>
            <label><input type="checkbox" name="lenguajes" value="C++">C++</label>

            <button type="button" id="mostrar">Mostrar lenguajes</button>
            <button type="button" id="selTodos">Seleccionar todos</button>
            <button type="button" id="desTodos">Desmarcar todos</button>
            <button type="button" id="altTodos">Seleccionar/Desmarcar todos</button>
            <p id="resultado"></p>
        </fieldset>
    </form>
    <script src="codigo.js"></script>
</body>
</html>
