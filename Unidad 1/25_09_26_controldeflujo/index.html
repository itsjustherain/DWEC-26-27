<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de flujo</title>
</head>
<body>
    <form name="selectForm">
        <p>
            <label for="musicTypes">Elija algunos tipos de música, luego haga clic en el botón de abajo:</label>
        </p>
        <p>
            <select id="musicTypes" name="musicTypes" multiple="multiple">
                <option selected="selected">R&B</option>
                <option>Jazz</option>
                <option>Blues</option>
                <option>New Age</option>
                <option>Classical</option>
                <option>Opera</option>
            </select>

            <select id="vacio" name="vacio" multiple="multiple">
            </select>
        </p>
        <p><input id="btn" type="button" value="¿Cuántos están seleccionados?"></p>
        <p><input id="btn2" type="button" value="Mover seleccionados"></p>
    </form>

    <script src="codigo.js"></script>
</body>
</html>
